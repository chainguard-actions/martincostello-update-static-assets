name: Test custom git user configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: octocat/hello-world
      GITHUB_TOKEN: fake-token-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test repo with no CDN assets
        run: |
          mkdir -p /tmp/git-user-repo
          cat > /tmp/git-user-repo/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>Test</title></head>
          <body><p>No CDN assets</p></body>
          </html>
          EOF
          cd /tmp/git-user-repo
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add .
          git commit -m "Initial commit"
      - id: action
        uses: .
        with:
          repo-token: fake-token-for-testing
          repo-path: /tmp/git-user-repo
          file-extensions: 'html'
          user-name: 'custom-bot'
          user-email: 'custom-bot@example.com'
          commit-message: 'chore: update static assets'
        env:
          GITHUB_REPOSITORY: octocat/hello-world
      - name: Assert action completed successfully with custom git user
        env:
          ASSETS_UPDATED: ${{ steps.action.outputs.assets-updated }}
        run: |
          echo "assets-updated: $ASSETS_UPDATED"
          if [ "$ASSETS_UPDATED" = "true" ]; then
            echo "FAIL: expected no assets to be updated"
            exit 1
          fi
          echo "PASS: action completed with custom git user configuration"
      - name: Assert pulls-opened is empty
        env:
          PULLS_OPENED: ${{ steps.action.outputs.pulls-opened }}
        run: |
          echo "pulls-opened: $PULLS_OPENED"
          if [ "$PULLS_OPENED" = "[]" ] || [ -z "$PULLS_OPENED" ]; then
            echo "PASS: no pull requests opened"
          else
            echo "FAIL: expected no pull requests, got: $PULLS_OPENED"
            exit 1
          fi
