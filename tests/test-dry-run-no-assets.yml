name: Test dry-run with no CDN assets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test HTML file with no CDN assets
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-site"
          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<html>' \
            '  <head>' \
            '    <title>Test Page</title>' \
            '    <link rel="stylesheet" href="/local/styles.css">' \
            '  </head>' \
            '  <body>' \
            '    <script src="/local/app.js"></script>' \
            '  </body>' \
            '</html>' \
            > "$GITHUB_WORKSPACE/test-site/index.html"

      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          repo-path: ${{ github.workspace }}/test-site
          file-extensions: html
          dry-run: true

      - name: Assert assets-updated is false
        env:
          ACTUAL: ${{ steps.action.outputs.assets-updated }}
        run: |
          echo "actual assets-updated: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected assets-updated to be 'false', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert pulls-opened is empty array
        env:
          ACTUAL: ${{ steps.action.outputs.pulls-opened }}
        run: |
          echo "actual pulls-opened: $ACTUAL"
          if [ "$ACTUAL" != "[]" ]; then
            echo "FAIL: expected pulls-opened to be '[]', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert pulls-closed is empty array
        env:
          ACTUAL: ${{ steps.action.outputs.pulls-closed }}
        run: |
          echo "actual pulls-closed: $ACTUAL"
          if [ "$ACTUAL" != "[]" ]; then
            echo "FAIL: expected pulls-closed to be '[]', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
