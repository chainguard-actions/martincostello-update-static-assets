name: Test - Custom File Extensions
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture files with custom extensions
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/custom-ext"
          # Create a .cshtml file with no CDN references
          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom-ext/page.cshtml" << 'EOF'
          <!DOCTYPE html>
          <html>
            <head><title>Razor Page</title></head>
            <body><p>No CDN assets here.</p></body>
          </html>
          EOF
          # Create a .razor file with no CDN references
          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom-ext/component.razor" << 'EOF'
          <div>
            <p>Razor component with no CDN assets.</p>
          </div>
          EOF

      - id: action
        uses: .
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          repo-path: ${{ github.workspace }}/tests/fixtures/custom-ext
          file-extensions: cshtml,razor

      - name: Assert assets-updated is false
        env:
          ACTUAL: ${{ steps.action.outputs.assets-updated }}
        run: |
          echo "actual assets-updated: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected assets-updated to be 'false', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: assets-updated is false"

      - name: Assert pulls-opened is empty array
        env:
          ACTUAL: ${{ steps.action.outputs.pulls-opened }}
        run: |
          echo "actual pulls-opened: $ACTUAL"
          if [ "$ACTUAL" != "[]" ]; then
            echo "FAIL: expected pulls-opened to be '[]', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: pulls-opened is []"
