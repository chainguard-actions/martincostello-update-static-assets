name: Test - No Static Assets to Update
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: martincostello/update-static-assets
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create empty test directory
        run: |
          mkdir -p /tmp/test-repo
          echo "<html><body>Hello World</body></html>" > /tmp/test-repo/index.html

      - id: action
        uses: .
        with:
          repo-token: fake-token-for-testing
          repo-path: /tmp/test-repo
          repo: martincostello/update-static-assets
        continue-on-error: true

      - name: Assert assets-updated output is false
        env:
          ASSETS_UPDATED: ${{ steps.action.outputs.assets-updated }}
        run: |
          echo "assets-updated: $ASSETS_UPDATED"
          if [ "$ASSETS_UPDATED" != "false" ]; then
            echo "FAIL: expected assets-updated to be 'false', got '$ASSETS_UPDATED'"
            exit 1
          fi
          echo "PASS"

      - name: Assert pulls-opened output is empty array
        env:
          PULLS_OPENED: ${{ steps.action.outputs.pulls-opened }}
        run: |
          echo "pulls-opened: $PULLS_OPENED"
          if [ "$PULLS_OPENED" != "[]" ]; then
            echo "FAIL: expected pulls-opened to be '[]', got '$PULLS_OPENED'"
            exit 1
          fi
          echo "PASS"

      - name: Assert pulls-closed output is empty array
        env:
          PULLS_CLOSED: ${{ steps.action.outputs.pulls-closed }}
        run: |
          echo "pulls-closed: $PULLS_CLOSED"
          if [ "$PULLS_CLOSED" != "[]" ]; then
            echo "FAIL: expected pulls-closed to be '[]', got '$PULLS_CLOSED'"
            exit 1
          fi
          echo "PASS"
