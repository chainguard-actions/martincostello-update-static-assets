name: Test HTML file with no recognized CDN assets - no updates needed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test fixture directory with HTML using unrecognized CDN URLs
        run: |
          mkdir -p /tmp/test-cdn-assets
          printf '<!DOCTYPE html>\n<html>\n<head>\n  <title>Test Page</title>\n  <link rel="stylesheet" href="https://unpkg.com/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous" />\n</head>\n<body>\n  <h1>Hello World</h1>\n  <script src="https://unpkg.com/jquery@3.7.1/dist/jquery.min.js" crossorigin="anonymous"></script>\n</body>\n</html>\n' > /tmp/test-cdn-assets/index.html

      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          repo-path: /tmp/test-cdn-assets
          file-extensions: 'html'

      - name: Assert assets-updated is false
        env:
          ACTUAL: ${{ steps.action.outputs.assets-updated }}
        run: |
          echo "actual assets-updated: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected assets-updated to be 'false', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert pulls-opened is empty array
        env:
          ACTUAL: ${{ steps.action.outputs.pulls-opened }}
        run: |
          echo "actual pulls-opened: $ACTUAL"
          if [ "$ACTUAL" != "[]" ]; then
            echo "FAIL: expected pulls-opened to be '[]', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert pulls-closed is empty array
        env:
          ACTUAL: ${{ steps.action.outputs.pulls-closed }}
        run: |
          echo "actual pulls-closed: $ACTUAL"
          if [ "$ACTUAL" != "[]" ]; then
            echo "FAIL: expected pulls-closed to be '[]', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
