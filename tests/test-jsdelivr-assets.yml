name: Test - JSDelivr CDN Assets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git for commits
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Ensure origin remote exists (action uses git remote set-url origin)
          git remote get-url origin 2>/dev/null || \
            git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"

      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          repo-path: ${{ github.workspace }}/tests/fixtures/jsdelivr
          dry-run: 'true'
          file-extensions: 'html'

      - name: Assert action completed with expected outputs
        env:
          ASSETS_UPDATED: ${{ steps.action.outputs.assets-updated }}
          PULLS_OPENED: ${{ steps.action.outputs.pulls-opened }}
          PULLS_CLOSED: ${{ steps.action.outputs.pulls-closed }}
        run: |
          echo "assets-updated: $ASSETS_UPDATED"
          echo "pulls-opened: $PULLS_OPENED"
          echo "pulls-closed: $PULLS_CLOSED"

          # bootstrap 4.0.0 is definitely not the latest, so assets-updated should be true
          if [ "$ASSETS_UPDATED" != "true" ]; then
            echo "FAIL: expected assets-updated to be 'true' for old bootstrap version, got '$ASSETS_UPDATED'"
            exit 1
          fi

          # In dry-run mode, no real PRs are opened (PR number is 0 as placeholder)
          # pulls-closed should be empty since no PRs were superseded
          if [ "$PULLS_CLOSED" != "[]" ]; then
            echo "FAIL: expected pulls-closed to be '[]' in dry-run mode, got '$PULLS_CLOSED'"
            exit 1
          fi

          # In dry-run mode, pulls-opened contains [0] as a placeholder (no real PR created)
          if [ "$PULLS_OPENED" != "[0]" ]; then
            echo "FAIL: expected pulls-opened to be '[0]' in dry-run mode, got '$PULLS_OPENED'"
            exit 1
          fi

          echo "PASS"
