name: Test custom file extensions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dedicated directory with a txt file containing no CDN assets
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp-custom-ext"
          echo "This is a plain text file with no CDN references." > "$GITHUB_WORKSPACE/tests/tmp-custom-ext/notes.txt"

      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          repo-path: ${{ github.workspace }}/tests/tmp-custom-ext
          dry-run: 'true'
          file-extensions: 'txt'

      - name: Assert no assets found when scanning only txt files
        env:
          ACTUAL: ${{ steps.action.outputs.assets-updated }}
        run: |
          echo "actual assets-updated: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected assets-updated to be 'false' when scanning only txt files, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: assets-updated is false as expected (no CDN assets in txt files)"

      - name: Assert pulls-opened is empty when no assets found
        env:
          ACTUAL: ${{ steps.action.outputs.pulls-opened }}
        run: |
          echo "actual pulls-opened: $ACTUAL"
          if [ "$ACTUAL" != "[]" ]; then
            echo "FAIL: expected pulls-opened to be '[]', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: pulls-opened is []"

      - name: Assert pulls-closed is empty when no assets found
        env:
          ACTUAL: ${{ steps.action.outputs.pulls-closed }}
        run: |
          echo "actual pulls-closed: $ACTUAL"
          if [ "$ACTUAL" != "[]" ]; then
            echo "FAIL: expected pulls-closed to be '[]', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: pulls-closed is []"
