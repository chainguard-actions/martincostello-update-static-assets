name: Test custom file extensions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files with custom extensions
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-site"

          # Create an HTML file with a CDN asset (should NOT be scanned since we only scan .cshtml)
          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<html>' \
            '  <body>' \
            '    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>' \
            '  </body>' \
            '</html>' \
            > "$GITHUB_WORKSPACE/test-site/page.html"

          # Create a .cshtml file with no CDN assets (this WILL be scanned)
          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<html>' \
            '  <head><title>Razor Page</title></head>' \
            '  <body><p>Hello from Razor</p></body>' \
            '</html>' \
            > "$GITHUB_WORKSPACE/test-site/page.cshtml"

      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          repo-path: ${{ github.workspace }}/test-site
          file-extensions: cshtml
          dry-run: true

      - name: Assert no assets updated (cshtml file has no CDN assets)
        env:
          ACTUAL: ${{ steps.action.outputs.assets-updated }}
        run: |
          echo "actual assets-updated: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected assets-updated to be 'false' (cshtml file has no CDN assets), got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: assets-updated is false as expected"

      - name: Assert pulls-opened is empty array
        env:
          ACTUAL: ${{ steps.action.outputs.pulls-opened }}
        run: |
          echo "actual pulls-opened: $ACTUAL"
          if [ "$ACTUAL" != "[]" ]; then
            echo "FAIL: expected pulls-opened to be '[]', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
