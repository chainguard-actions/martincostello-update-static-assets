name: Test dry-run with jsDelivr CDN assets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test site with git repo and outdated jsDelivr CDN asset
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-site"
          cd "$GITHUB_WORKSPACE/test-site"

          # Initialize a git repo so the action can run git operations
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Add a placeholder origin remote (fetch errors are ignored by the action)
          git remote add origin https://github.com/martincostello/update-static-assets.git

          # Create HTML file with an outdated jsDelivr CDN asset (bootstrap 4.6.2 is outdated)
          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<html>' \
            '  <head>' \
            '    <title>Test Page</title>' \
            '    <link rel="stylesheet"' \
            '          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"' \
            '          integrity="sha256-+IZRbz1B6ee9mUx/ejmonK+ulIP5A5bLDd6v5AmznGs="' \
            '          crossorigin="anonymous">' \
            '  </head>' \
            '  <body>' \
            '    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"' \
            '            integrity="sha256-+IZRbz1B6ee9mUx/ejmonK+ulIP5A5bLDd6v5AmznGs="' \
            '            crossorigin="anonymous"></script>' \
            '  </body>' \
            '</html>' \
            > index.html

          # Commit the file so git is in a clean state
          git add index.html
          git commit -m "Initial commit"

      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          repo-path: ${{ github.workspace }}/test-site
          file-extensions: html
          dry-run: true

      - name: Assert action completed and no PRs were pushed in dry-run mode
        env:
          ASSETS_UPDATED: ${{ steps.action.outputs.assets-updated }}
          PULLS_OPENED: ${{ steps.action.outputs.pulls-opened }}
          PULLS_CLOSED: ${{ steps.action.outputs.pulls-closed }}
        run: |
          echo "assets-updated: $ASSETS_UPDATED"
          echo "pulls-opened: $PULLS_OPENED"
          echo "pulls-closed: $PULLS_CLOSED"

          # assets-updated should be a boolean string
          if [ "$ASSETS_UPDATED" != "true" ] && [ "$ASSETS_UPDATED" != "false" ]; then
            echo "FAIL: expected assets-updated to be 'true' or 'false', got '$ASSETS_UPDATED'"
            exit 1
          fi
          echo "PASS: assets-updated has a valid boolean value: $ASSETS_UPDATED"

          # pulls-closed should always be empty in dry-run mode
          if [ "$PULLS_CLOSED" != "[]" ]; then
            echo "FAIL: expected pulls-closed to be '[]' in dry-run mode, got '$PULLS_CLOSED'"
            exit 1
          fi
          echo "PASS: pulls-closed is empty as expected in dry-run mode"

          # In dry-run mode with assets updated, pulls-opened contains [0] (placeholder PR number).
          # If no assets needed updating, pulls-opened is [].
          # Both are valid outcomes depending on CDN state.
          if [ "$PULLS_OPENED" != "[]" ] && [ "$PULLS_OPENED" != "[0]" ]; then
            echo "FAIL: expected pulls-opened to be '[]' or '[0]' in dry-run mode, got '$PULLS_OPENED'"
            exit 1
          fi
          echo "PASS: pulls-opened has a valid value in dry-run mode: $PULLS_OPENED"
