name: Test optional inputs - custom user and close-superseded false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test fixture directory with cshtml file and no CDN assets
        run: |
          mkdir -p /tmp/test-optional-inputs
          printf '@{\n    ViewData["Title"] = "Home Page";\n}\n<div class="text-center">\n    <h1>Hello World</h1>\n</div>\n' > /tmp/test-optional-inputs/page.cshtml

      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          repo-path: /tmp/test-optional-inputs
          file-extensions: 'cshtml'
          close-superseded: 'false'
          user-name: 'test-bot'
          user-email: 'test-bot@example.com'
          branch-name-prefix: 'update-assets/'
          commit-message: 'chore: update static assets'

      - name: Assert assets-updated is false
        env:
          ACTUAL: ${{ steps.action.outputs.assets-updated }}
        run: |
          echo "actual assets-updated: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected assets-updated to be 'false', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert pulls-opened is empty array
        env:
          ACTUAL: ${{ steps.action.outputs.pulls-opened }}
        run: |
          echo "actual pulls-opened: $ACTUAL"
          if [ "$ACTUAL" != "[]" ]; then
            echo "FAIL: expected pulls-opened to be '[]', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert pulls-closed is empty array
        env:
          ACTUAL: ${{ steps.action.outputs.pulls-closed }}
        run: |
          echo "actual pulls-closed: $ACTUAL"
          if [ "$ACTUAL" != "[]" ]; then
            echo "FAIL: expected pulls-closed to be '[]', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
